name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ dev,main,repebble1 ]
  pull_request:
    branches: [ dev,main,repebble1 ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: install pebble
        run: uv tool install pebble-tool
      - name: install sdk
        run: pebble sdk install 4.9.148
      - name: mkdir
        run: mkdir resources/data -p
        working-directory: ./pebblebike
      - name: touch bin
        run: for n in aplite basalt chalk diorite; do touch resources/data/OVL_$n.bin; done
        working-directory: ./pebblebike
      - name: make
        run: pebble build 
        working-directory: ./pebblebike
      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: App
          path: ${{ github.workspace }}/build/*.pb*
